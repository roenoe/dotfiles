console_title_template = '{{ if .Root }} root@{{ end }}{{ .HostName }} {{ .PWD }}'
final_space = true
version = 3
enable_cursor_positioning = true  # if you have issues with your prompt taking a while to start, disable this

# palette for everyone except root
[palette]
  black = '#000000'
  red = 'red'
  green = 'green'
  yellow = 'yellow'
  blue = 'blue'
  magenta = 'magenta'
  lightMagenta = 'lightMagenta'
  cyan = 'cyan'
  white = '#eeeeee'
  background = '#3c3836'

# check for whether root is present
[palettes]
  template = '{{ if .Root }}root{{end}}'

# palette for root
  [palettes.list.root]
    background = 'red'
    black = '#000000'
    red = '#000000'
    green = '#000000'
    yellow = '#000000'
    blue = '#000000'
    magenta = '#000000'
    lightMagenta = '#000000'
    cyan = '#000000'
    white = '#ffffff'

###############
# left blocks #
###############

# OS icon block
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'os'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:background'
    foreground = 'p:white'
    template = '{{.Icon}} '

# username@host block
[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    type = 'session'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:background'
    foreground = 'p:green'
    template = ' {{ if .SSHSession }} {{ end }}{{ .UserName }}</><p:blue>@</><p:red>{{ .HostName }} '

# path + git block (git must share the block so the path template can read .Segments.Git)
[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    type = 'path'
    style = 'powerline'
    powerline_symbol = ''
    foreground = 'p:yellow'
    background = 'p:background'
    template = ' {{ if and .Segments.Git.RepoName (ne .Segments.Git.RepoName .Path) }}{{ .Segments.Git.RepoName }}{{ trimPrefix .Segments.Git.Dir .PWD }}{{ else }}{{ .Path }}{{ end }}</> '

# path block properties
    [blocks.segments.properties]
      style = 'agnoster_full'

# git segment
  [[blocks.segments]]
    type = 'git'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:background'
    foreground = 'p:magenta'
    template = ' {{ .HEAD }}<p:lightMagenta>{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} {{if .BranchStatus }} {{ .BranchStatus }} {{ end }}</>'

# git block properties
    [blocks.segments.properties]
      commit_icon = '@'
      fetch_status = true

# executiontime block (also feeds .Segments.Executiontime to the transient prompt)
[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'powerline'
    powerline_symbol = ''
    foreground = 'p:yellow'
    background = 'p:background'
    template = ' {{ .FormattedMs }} '

# only report commands slower than 5s
    [blocks.segments.properties]
      threshold = 5000

###############
# right block #
###############

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

# time block
  [[blocks.segments]]
    type = 'time'
    style = 'diamond'
    leading_diamond = ' '
    trailing_diamond = ''
    foreground = 'p:cyan'
    background = 'p:background'
    template = '{{ .CurrentDate | date .Format}}'

# time block properties
    [blocks.segments.properties]
      time_format = '15:04'
###############
# second line #
###############

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

# prompt
  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}red{{end}}',]
    foreground = 'lightGreen'
    template = '➜'

# what previous prompts look like
[transient_prompt]
  background = 'transparent'
  foreground = 'lightGreen'
  foreground_templates = ['{{if gt .Code 0}}red{{end}}',]
  template = '{{ if .Segments.Executiontime.FormattedMs }}<p:yellow>{{ .Segments.Executiontime.FormattedMs }}</> {{ end }}➜ '
